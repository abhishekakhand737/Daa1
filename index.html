<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Chain Multiplication</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #6A11CB, #2575FC);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 30px 40px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        width: 350px;
    }

    h2 {
        margin-bottom: 20px;
    }

    input {
        width: 90%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        margin: 10px 0;
        text-align: center;
        font-size: 16px;
    }

    button {
        background-color: #00c6ff;
        border: none;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 8px;
        margin-top: 10px;
        transition: 0.3s;
    }

    button:hover {
        background-color: #0072ff;
    }

    .result {
        margin-top: 20px;
        font-weight: bold;
        font-size: 18px;
        color: #fff;
    }

    .error {
        color: #ffcccc;
        font-size: 14px;
        margin-top: 10px;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Matrix Chain Multiplication</h2>
    <p>Enter matrix dimensions (comma separated):</p>
    <input type="text" id="dims" placeholder="e.g. 10,20,30,40">
    <button onclick="compute()">Compute</button>
    <div class="result" id="result"></div>
    <div class="error" id="error"></div>
</div>

<script>
function matrixChainOrder(p) {
    let n = p.length - 1;
    let m = Array.from({ length: n }, () => Array(n).fill(0));

    for (let L = 2; L <= n; L++) { // chain length
        for (let i = 0; i < n - L + 1; i++) {
            let j = i + L - 1;
            m[i][j] = Infinity;
            for (let k = i; k < j; k++) {
                let q = m[i][k] + m[k + 1][j] + p[i] * p[k + 1] * p[j + 1];
                if (q < m[i][j]) {
                    m[i][j] = q;
                }
            }
        }
    }
    return m[0][n - 1];
}

function compute() {
    let dimsInput = document.getElementById("dims").value;
    let resultDiv = document.getElementById("result");
    let errorDiv = document.getElementById("error");

    resultDiv.textContent = "";
    errorDiv.textContent = "";

    try {
        let p = dimsInput.split(',').map(Number);
        if (p.some(isNaN)) throw new Error();

        if (p.length < 2) {
            errorDiv.textContent = "Enter at least 2 dimensions.";
            return;
        }

        let result = matrixChainOrder(p);
        resultDiv.textContent = `Minimum Multiplications: ${result}`;
    } catch {
        errorDiv.textContent = "Invalid input. Please enter numbers separated by commas.";
    }
}
</script>

</body>
</html>
